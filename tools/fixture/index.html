<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Pesanan Saya | Shopee Seller Centre</title>
    <style>
      body { margin: 0; font: 14px/1.5 "Segoe UI", Arial, sans-serif; background: #f5f5f5; }
      header { display: flex; align-items: center; gap: 18px; padding: 10px 20px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
      .brand { color: #ee4d2d; font-weight: 700; }
      .spacer { flex: 1; }
      .icon-wrap { position: relative; cursor: pointer; }
      .badge-count { position: absolute; top: -6px; right: -10px; min-width: 16px; padding: 0 4px;
        background: #ee4d2d; color: #fff; border-radius: 9px; font-size: 11px; text-align: center; }
      .hidden { display: none; }
      main { padding: 24px; }
      button { padding: 8px 12px; margin: 0 6px 8px 0; cursor: pointer; }
      code { background: #eee; padding: 1px 4px; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Shopee Seller Centre</span>
      <span class="spacer"></span>
      <div class="icon-wrap" aria-label="Chat Pembeli" data-testid="webchat-entry">
        💬
        <span class="badge-count chat-unread hidden" id="chat-badge">0</span>
      </div>
      <div class="icon-wrap" aria-label="Notifikasi" data-testid="notification-bell">
        🔔
        <span class="badge-count notification-badge hidden" id="notif-badge">0</span>
      </div>
      <span>Toko Sepatu Jaya</span>
    </header>
    <main>
      <h2>Harness uji ekstensi</h2>
      <p>Simulasi perilaku Seller Centre: badge header, prefix judul, dan respons API unread.</p>
      <button id="b-notif">+1 badge notifikasi (DOM)</button>
      <button id="b-chat">+1 badge chat (DOM)</button>
      <button id="b-title">+1 lewat judul tab</button>
      <button id="b-api-chat">fetch /api/webchat/unread (+1)</button>
      <button id="b-api-notif">fetch /api/notification/unread_count (+1)</button>
      <button id="b-clear">reset semua ke 0</button>
      <p>Status: <code id="state">notif=0 chat=0</code></p>
    </main>
    <script>
      // Seller Centre asli menaruh info toko di state global; hook membacanya
      // supaya notifikasi multi-akun menampilkan nama toko.
      window.__INITIAL_STATE__ = { shop: { name: "Toko Sepatu Jaya" } };
      let notif = 0, chat = 0;
      const $ = (id) => document.getElementById(id);
      function paint() {
        for (const [n, el] of [[notif, $("notif-badge")], [chat, $("chat-badge")]]) {
          el.textContent = String(n);
          el.classList.toggle("hidden", n === 0);
        }
        const total = notif + chat;
        const base = "Pesanan Saya | Shopee Seller Centre";
        document.title = total > 0 ? `(${total}) ${base}` : base;
        $("state").textContent = `notif=${notif} chat=${chat}`;
      }
      $("b-notif").onclick = () => { notif++; paint(); };
      $("b-chat").onclick = () => { chat++; paint(); };
      $("b-title").onclick = () => {
        const m = document.title.match(/^\((\d+)\)/);
        document.title = `(${(m ? +m[1] : 0) + 1}) Pesanan Saya | Shopee Seller Centre`;
      };
      $("b-api-chat").onclick = () => fetch("/api/webchat/unread?bump=1").then((r) => r.json());
      $("b-api-notif").onclick = () => fetch("/api/notification/unread_count?bump=1").then((r) => r.json());
      $("b-clear").onclick = () => { notif = 0; chat = 0; paint(); fetch("/api/reset"); };
      paint();
    </script>
  </body>
</html>
